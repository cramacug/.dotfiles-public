############################################################
## TMUX
# https://www.man7.org/linux/man-pages/man1/tmux.1.html
############################################################

####################
# PREFIX: Set Contrl + b as the prefix
####################
set -g prefix C-b
bind C-b send-prefix

####################
# PENDING
####################
# Prefer modern terminfo if present (install via ncurses/terminfo if needed)
set -g default-terminal "tmux-256color"

# Truecolor support for modern terminals
# set -as terminal-features ",xterm-256color:RGB,tmux-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

# set -g set-clipboard on
# set -g allow-passthrough on
# set -s set-clipboard external

set -g history-limit 50000
set-option -g xterm-keys on
set-option -sg escape-time 10
# get links working
# set -ga terminal-features "*:hyperlinks"

####################
# BUFFERS
####################
# bind ` copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
# Setup 'y' to yank (copy), just like Vim
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
bind B list-buffers     # list paste buffers
# bind p paste-buffer
bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from


####################
# Reload configuration with r
####################
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

####################
# Set C+Y synchornize panes
####################
bind C-Y set-window-option synchronize-panes


####################
## MOUSE
####################
# Tmux mouse mode
set-option -g mouse on


####################################################
# STATUS BAR (minimal: windows | keyboard :: time :: date)
####################################################
set -g status on
set -g status-position top
set -g status-justify left
set -g status-keys vi
set -g status-interval 10
set -g status-style "fg=#7f8896,bg=#22252b"

set -g status-left-length 40
# renders: [W:P]::[1:1] || window list   (legend :: current window:pane || windows)
set -g  status-left "#[fg=#4a505c][[#[fg=#5c6370]W#[fg=#4a505c]:#[fg=#5c6370]P#[fg=#4a505c]]::"
set -ag status-left "[#[fg=#5c6370]#{window_index}#[fg=#4a505c]:#[fg=#5c6370]#{pane_index}#[fg=#4a505c]]]"
set -ag status-left " #[fg=#4a505c,nobold]>>    #[nobold] "
set -g status-right-length 80
# user and date are hidden when the client is narrower than 100 columns
set -g status-right "#{prefix_highlight} #[fg=#7fa6c9]#{keyboard_layout}#[fg=#4a505c] :: #{?#{e|>=:#{client_width},100},#[fg=#d08770]#(id -un) #[fg=#4a505c]:: #[fg=#98a2b3]%Y-%m-%d#[fg=#b48ead]T,}#[fg=#a3be8c]%H:%M "

# Windows: same label for all, current one highlighted (no background block)
set -g window-status-separator "  "
# names are cut at 18 chars so many windows still fit in half a screen
set -g window-status-format "[#I]:#{=/18/…:window_name}#F"
set -g window-status-current-format "#[fg=#e0af68,bold][#I]:#{=/18/…:window_name}#F"
set -g window-status-style "fg=#7f8896,bg=default"
set -g window-status-current-style "bg=default"

####################################################
# Windows & Panes
####################################################
set -g base-index 1
setw -g pane-base-index 1
# set-option -g base-index 1 # Start windows and panes index at 1, not 0.
setw -g aggressive-resize on
set -g renumber-windows on

# setw -g pane-border-style fg=colour240
set-window-option -g pane-border-style fg=colour240
# set -g pane-active-border-style fg=colour209,bg=default
set -g pane-active-border-style fg=colour83,bg=default
# set -g pane-active-border-style fg=colour83,bg=colour83
set -g pane-border-indicators colour # off | colour | arrows | both
set -g pane-border-lines heavy # single | double | heavy | simple | number | spaces
set -g pane-border-status off  # off | top | bottom
set -g pane-border-format " #{pane_index} #{pane_current_command}"


####################
# Windows
####################
# copy mode highlight
# set-window-option -g mode-style "fg=#bdae93,bg=#504945"
set-window-option -g mode-style "fg=blue,bg=orange"

####################
# SPLIT windows 
####################
# use PREFIX | to split window vertically
unbind %
bind | split-window -h -c "#{pane_current_path}"
# use PREFIX - to split window horizontally 
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind n
bind n new-window -c "#{pane_current_path}"

# unbind .
# Remove current bindings
unbind <
unbind >

# Window menu
# -x W -y W 
bind . display-menu -T "#[align=centre]Window Menu" \
    -x C -y C \
    "Rename Window" r "command-prompt -I '#W' 'rename-window %%'" \
    "Kill Window" x "kill-window" \
    "Swap Left"  < "swap-window -t :-1" \
    "Swap Right" > "swap-window -t :+1" \
    "Select Layout" l "choose-layout"

# Pane menu
bind , display-menu -T "#[align=centre]Pane Menu" \
    -x C -y C \
    "Split Horizontal" - "split-window -v" \
    "Split Vertical" | "split-window -h" \
    "Kill Pane" x "kill-pane" \
    "Resize Pane" r "resize-pane -Z"


####################
# RESIZE panes with alt arrow keys
####################
# unbind %
# bind-key -n C-S-Up resize-pane -U 10
# bind-key -n C-S-Down resize-pane -D 10
# bind-key -n C-S-Left resize-pane -L 10
# bind-key -n C-S-Right resize-pane -R 10

####################
# Make the current window the first window
####################
bind T swap-window -t :1

# Move windows (Option (Alt) + shift + Left/Right)
bind-key -n M-Left swap-window -t -1 \; select-window -t -1 	#	\; display-message "M-Left Swap left"
bind-key -n M-Right swap-window -t +1 \; select-window -t +1 	#	\; display-message "M-Right Swap right"
# bind-key -n C-S-Left swap-window -t -1 \; select-window -t -1 	\; display-message "C-S Swap left"
# bind-key -n C-S-Right swap-window -t +1 \; select-window -t +1 	\; display-message "C-S Swap right"

####################
# Rename Window
####################
unbind R
bind-key R command-prompt -I "#W" "rename-window '%%'"
set -g allow-rename off
set -g automatic-rename off
#Testint automatic rename
# set -g allow-rename on
# set -g automatic-rename on
# set -g automatic-rename-format "#{?pane_in_mode,[copy],#{pane_current_command}}"

##########################################
### TESTING Fix titlebar
set -g set-titles on
set -g set-titles-string "#T"
# default statusbar colors
# set-option -g status-style "fg=#bdae93,bg=#3c3836"
# clock
# set-window-option -g clock-mode-colour "#b8bb26"

# set -g cursor-colour yellow
# enable activity alerts
# setw -g monitor-activity on
# set -g visual-activity 



####################
# Like vim
####################
set-window-option -g mode-keys vi

####################
# Neovim
####################
set -g focus-events on


### Pi.dev
set -g extended-keys on
set -g extended-keys-format csi-u

##########################################################################################################
################################################################################
## TMUX PLUGIN MANAGER
################################################################################
##########################################################################################################
## https://github.com/tmux-plugins/tpm
## git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

####################
## tmux manual actions -->  https://github.com/tmux-plugins/tpm/blob/master/docs/managing_plugins_via_cmd_line.md
####################


####################
## Installing plugin
####################
# As usual, plugins need to be specified in .tmux.conf. Run the following command to install plugins:
# ~/.tmux/plugins/tpm/bin/install_plugins

####################
## Updating plugins
####################
# To update all installed plugins:
# ~/.tmux/plugins/tpm/bin/update_plugins all
# or update a single plugin:
# ~/.tmux/plugins/tpm/bin/update_plugins tmux-sensible

####################
## Removing plugins
####################
# To remove plugins not on the plugin list:
# ~/.tmux/plugins/tpm/bin/clean_plugins

########################################
# List of plugins
########################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'imomaliev/tmux-keyboard-layout'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# keep continuum last: it hooks into status-right, so it must load after the plugins that rewrite it
set -g @plugin 'tmux-plugins/tmux-continuum'

########################################
# Plugin configurations
########################################

####################
# tmux-resurrect
####################
# tmux-resurrect extra settings 
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
# keep nvim sessions after reboot
set -g @resurrect-strategy-nvim 'session'

####################
# tmux-continuum
####################
# restore the last saved environment automatically when the tmux server starts
set -g @continuum-restore 'on'
# Set autosave interval
set -g @continuum-save-interval '15'
####################

########################################
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
########################################
# run '~/.tmux/plugins/tpm/tpm'
run $HOMEBREW_PREFIX/share/tpm/tpm

